clusterConnections:
  # This name will be used in log labels and metrics, so pick a name not shared by other s2s-proxy deployments
  - name: "my-migration-cluster"
    # local defines your local Temporal cluster's connections
    local:
      # Unless you're daisy-chaining proxies, this should always be tcp for the local cluster
      connectionType: "tcp"
      tcpClient:
        address: "frontend-ingress.temporal.svc.cluster.local:7233"
        # If your local Temporal uses TLS, use this block to configure it.
        # tls:
        #   certificatePath: ""
        #   keyPath: ""
        #   remoteCAPath: ""
      tcpServer:
        address: "0.0.0.0:9233"
        # If you want the proxy to use TLS for your local outbound connection, use this block
        # tls:
        #   certificatePath: ""
        #   keyPath: ""
        #   remoteCAPath: ""
    # remote describes the remote cluster's connection details
    remote:
      # Remotes are usually "mux-client" or "mux-server", but "tcp" is supported
      connectionType: "mux-client"
      # When using mux-*, the muxCount defines how many connections to open to the remote server. We recommend at least 10.
      muxCount: 10
      # The proxy will use this address to connect to the remote mux-server.
      muxAddressInfo:
        address: "remote_proxy_service:8233"
        tls:
          certificatePath: ""
          keyPath: ""
          remoteCAPath: "" # path to the CA cert that signed the remote server's cert; empty = use system root CAs
          caServerName: "" # required unless skipCAVerification: true; must match the remote cert's SAN/CN
    # This should be the routable address
    replicationEndpoint: "my-s2s-proxy.svc.cluster.local:9233"
    # This is what the remote cluster is allowed to access on your local cluster
    aclPolicy:
      allowedMethods:
        adminService:
        # Optional. If configured, these methods are required to support multi-cluster replication.
          - AddOrUpdateRemoteCluster
          - RemoveRemoteCluster
          - DescribeCluster
          - DescribeMutableState
          - GetNamespaceReplicationMessages
          - GetWorkflowExecutionRawHistoryV2
          - ListClusters
          - StreamWorkflowReplicationMessages
          - ReapplyEvents
          - GetNamespace
          - SyncWorkflowState
        # Optional. Narrows what the remote cluster may call on this proxy's own admin API.
        # Absent means the built-in default: DescribeClusterConnections and nothing else.
        # An empty list serves nothing.
        # That is how an operator declines to answer this counterparty at all.
        # This differs from adminService above, where an empty list allows everything.
        # proxyAdmin:
        #   - DescribeClusterConnections
      allowedNamespaces:
        # Optional. If configured, the temporal-system namespace must be included to allow migration workflows to run.
        - "temporal-system"
        - "myNamespace"
    # Namespace translations are bi-directional and apply to both local and remote requests.
    namespaceTranslation:
      mappings:
        - local: "myNamespace"
          remote: "myNamespace.accountid"
    # If you have custom search attributes, you can map them here. Like the namespace translation, these are bi-directional.
    # searchAttributeTranslation:
    #   namespaceMappings:
    #     - name: "myNamespace"
    #       namespaceId: "my-namespace-id"
    #       mappings:
    #         - localFieldName: "localTextSearchAttribute"
    #           remoteFieldName: "Text01"
    #         - localFieldName: "localBoolSearchAttribute"
    #           remoteFieldName: "Bool01"

    remoteClusterHealthCheck:
      protocol: "http"
      listenAddress: "0.0.0.0:8234"
# Not implemented yet
#    localClusterHealthCheck:
#      protocol: "http"
#      listenAddress: "0.0.0.0:8235"

proxyAdmin:
  # Serves ProxyAdminService for operator queries.
  # It has no TLS and no authorization.
  # A non-loopback address is refused at startup.
  # Reach it with `kubectl exec` or a port-forward.
  listenAddress: "localhost:6061"
  # Uncomment to let one pod answer for the whole deployment.
  # Without this, a query describes only the pod that received it.
  # The dns name defaults to this release's headless Service.
  #
  # A non-loopback listener with no tls is refused at startup unless allowInsecure is set.
  # It publishes the deployment's topology to anything that can reach the pod network.
  #
  # peer:
  #   listenAddress: "0.0.0.0:9234"
  #   tls:
  #     certificatePath: /certs/peer.pem
  #     keyPath: /certs/peer.key
  #     remoteCAPath: /certs/ca.pem
  #     # Every pod's certificate must carry this as a SAN.
  #     # Peers are dialed by IP.
  #     # A per-pod SAN scheme fails every handshake.
  #     caServerName: s2s-proxy-peers
  #   discovery:
  #     provider: dns

metrics:
  prometheus:
    listenAddress: "0.0.0.0:9090"
profiling:
  pprofAddress: "localhost:6060"