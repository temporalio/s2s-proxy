# Mount TLS certificate
volumes:
  - name: s2c-server-tls
    secret:
      secretName: s2c-server-tls
      optional: false

volumeMounts:
  - name: s2c-server-tls
    mountPath: "/s2c-server-tls"
    readOnly: true

# The cluster connections this proxy serves, keyed by name. The key becomes the connection's name
# in the rendered config.
#
# Only the fields that differ from clusterConnectionDefaults in values.yaml appear here. Everything
# else, including the connection types, the mux count and the ACL method list, comes from there.
clusterConnections:
  my-migration-cluster:
    local:
      tcpClient:
        # Your Temporal server's frontend.
        address: "frontend-address:7233"
    remote:
      muxAddressInfo:
        # The migration endpoint.
        address: "s2s-proxy-sample.example.tmprl.cloud:8233"
        tls:
          # Your client certificate for mTLS authentication.
          certificatePath: "/s2c-server-tls/tls.crt"
          # The private key for that certificate.
          keyPath: "/s2c-server-tls/tls.key"
          # Must match a SAN or CN on the remote server's certificate.
          caServerName: "s2s-proxy-sample.example.tmprl.cloud"
    # Where the remote cluster reaches this proxy.
    replicationEndpoint: "my-s2s-proxy.svc.cluster.local:9233"
    aclPolicy:
      # Namespaces the remote cluster may act on. temporal-system is required for migration
      # workflows to run.
      allowedNamespaces:
        - "temporal-system"
        - "myNamespace"
    # Namespace translations apply in both directions.
    namespaceTranslation:
      mappings:
        - local: "myNamespace"
          remote: "myNamespace.accountid"
