suite: test deployment
templates:
  - deployment.yaml
tests:
  - it: should configure the image repo and tag
    set:
      image.repository: "testrepo/test"
      image.tag: "1.2.3"
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: RELEASE-NAME-s2s-proxy
      - equal:
          path: spec.template.spec.containers[0].image
          value: testrepo/test:1.2.3

  - it: should set container ports based on configOverride
    set:
      configOverride:
        clusterConnections:
          - remoteClusterHealthCheck:
              listenAddress: "0.0.0.0:1111"
            local:
              tcpServer:
                address: "127.0.0.1:2222"
            metrics:
              prometheus:
                listenAddress: ":3333"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - containerPort: 2222
              name: rpc-egress
              protocol: TCP
            - containerPort: 1111
              name: rpc-healthcheck
              protocol: TCP
            - containerPort: 3333
              name: rpc-metrics
              protocol: TCP

  # The peer listener is opt-in.
  # The default install exposes no extra port.
  - it: should not expose a peer port by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: rpc-peer
          any: true

  - it: should expose a peer port when peer discovery is enabled
    set:
      configOverride:
        proxyAdmin:
          peer:
            listenAddress: "0.0.0.0:9234"
            allowInsecure: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 9234
            name: rpc-peer
            protocol: TCP

  - it: should identify each pod for admin responses
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
