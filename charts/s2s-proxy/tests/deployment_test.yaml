suite: test deployment
templates:
  - deployment.yaml
tests:
  - it: should configure the image repo and tag
    set:
      image.repository: "testrepo/test"
      image.tag: "1.2.3"
      clusterConnections:
        only: {}
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: RELEASE-NAME-s2s-proxy
      - equal:
          path: spec.template.spec.containers[0].image
          value: testrepo/test:1.2.3

  - it: should set container ports from the rendered config
    set:
      config:
        metrics:
          prometheus:
            listenAddress: ":3333"
      clusterConnections:
        only:
          local:
            tcpServer:
              address: "127.0.0.1:2222"
          remoteClusterHealthCheck:
            listenAddress: "0.0.0.0:1111"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - containerPort: 2222
              name: rpc-egress-0
              protocol: TCP
            - containerPort: 1111
              name: rpc-health-0
              protocol: TCP
            - containerPort: 3333
              name: rpc-metrics
              protocol: TCP
