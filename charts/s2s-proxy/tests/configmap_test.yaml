suite: test configmap
templates:
  - configmap.yaml
tests:
  - it: should override s2s-proxy config
    set:
      configOverride:
        clusterConnections:
          - remoteClusterHealthCheck:
              listenAddress: 0.0.0.0:1111
            local:
              tcpClient:
                address: "frontend-other:2222"
            remote:
              muxAddressInfo:
                address: "addr:3333"
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: metadata.name
          pattern: RELEASE-NAME-s2s-proxy
      # Brittle regex matching. Not sure how better to check yaml inside of a string though.
      - matchRegex:
          path: data["config.yaml"]
          pattern: |-
            remoteClusterHealthCheck:
              \s*listenAddress: 0.0.0.0:1111
      - matchRegex:
          path: data["config.yaml"]
          pattern: |-
            tcpClient:
              \s*address: frontend-other:2222
      - matchRegex:
          path: data["config.yaml"]
          pattern: |-
            muxAddressInfo:
              \s*address: addr:3333

  # Layered configuration deep-merges and cannot delete keys.
  # Switching provider leaves the previous provider's block behind.
  # The rendered config must still select the new provider.
  # The binary ignores the leftover block.
  - it: should switch discovery provider without removing the previous block
    set:
      configOverride:
        proxyAdmin:
          peer:
            listenAddress: "0.0.0.0:9234"
            allowInsecure: true
            discovery:
              provider: static
              dns:
                name: leftover.svc
              static:
                addresses: ["p0:9234"]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "provider: static"

  - it: should default dns discovery to this release's headless service
    set:
      configOverride:
        proxyAdmin:
          peer:
            listenAddress: "0.0.0.0:9234"
            allowInsecure: true
            discovery:
              provider: dns
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "name: RELEASE-NAME-s2s-proxy\\.NAMESPACE\\.svc\\.cluster\\.local"
