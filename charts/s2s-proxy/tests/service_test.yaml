suite: test service
templates:
  - service.yaml
tests:
  - it: should expose the egress port of every cluster connection
    set:
      clusterConnections:
        first:
          local:
            tcpServer:
              address: "0.0.0.0:2222"
        second:
          local:
            tcpServer:
              address: "0.0.0.0:3333"
    asserts:
      - isKind:
          of: Service
      - matchRegex:
          path: metadata.name
          pattern: RELEASE-NAME-s2s-proxy
      - equal:
          path: spec.ports
          value:
            - port: 2222
              targetPort: 2222
              protocol: TCP
              name: rpc-egress-0
            - port: 3333
              targetPort: 3333
              protocol: TCP
              name: rpc-egress-1
