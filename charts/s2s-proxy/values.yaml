# Default values for s2s-proxy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: temporalio/s2s-proxy
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# We recommend a minimum of 4 CPUs, 512Mi for your proxy as a good starting point.
# If you have a larger dataset (>5RPS steady-state traffic, >10GB history size), a larger proxy deployment may be necessary
# requests:
#   cpu: 4
#   memory: 512Mi
resources: {}


# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health
    port: 8234
readinessProbe:
  httpGet:
    path: /health
    port: 8234

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# The proxy's cluster connections, keyed by name. The key becomes the connection's name in the
# rendered config, so it appears in log labels and metrics. Pick a name no other s2s-proxy
# deployment shares.
#
# Every install has to supply at least one. See values.example.yaml for a worked example.
#
# Each entry is merged over clusterConnectionDefaults below, so an entry only has to carry what
# differs from those defaults.
clusterConnections: {}

# Applied to every entry in clusterConnections. An entry that sets any of these replaces only the
# keys it names.
clusterConnectionDefaults:
  local:
    # Unless you are daisy-chaining proxies, the local cluster is always tcp.
    connectionType: "tcp"
    tcpServer:
      address: "0.0.0.0:9233"
  remote:
    # Remotes are usually mux-client or mux-server. tcp is supported.
    connectionType: "mux-client"
    # How many connections to open to the remote mux server. At least 10 is recommended.
    muxCount: 10
  aclPolicy:
    allowedMethods:
      # These methods are what multi-cluster replication needs. An empty list allows everything.
      adminService:
        - AddOrUpdateRemoteCluster
        - RemoveRemoteCluster
        - DescribeCluster
        - DescribeMutableState
        - GetNamespaceReplicationMessages
        - GetWorkflowExecutionRawHistoryV2
        - ListClusters
        - StreamWorkflowReplicationMessages
        - ReapplyEvents
        - GetNamespace
        - SyncWorkflowState
  remoteClusterHealthCheck:
    protocol: "http"
    listenAddress: "0.0.0.0:8234"

# Everything in the proxy's config file outside clusterConnections.
config:
  metrics:
    prometheus:
      listenAddress: "0.0.0.0:9090"
  profiling:
    pprofAddress: "localhost:6060"

