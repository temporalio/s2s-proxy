clusterConnections:
  - name: "myCoolCluster"
    local:
      connectionType: "tcp" # TCP type must define both inbound and outbound
      tcpClient:
        address: "127.0.0.1:9001"
        tls:
          certificatePath: ""
          keyPath: ""
          remoteCAPath: ""
          caServerName: ""
          skipCAVerification: true
      tcpServer:
        address: "127.0.0.1:9002"
        tls:
          certificatePath: ""
          keyPath: ""
          remoteCAPath: ""
          caServerName: ""
          skipCAVerification: true
      # HTTP/2 keepalive for the gRPC client and server built from this definition. Omit the block, or any field in
      # it, to keep grpc-go's defaults: the client never pings, and the server pings an idle client after 2h and
      # accepts at most one client ping every 5m, only while a stream is open.
      # A client must not ping more often than the server on the other end allows, or the server closes the
      # connection with GOAWAY "too_many_pings". Configure the server side first.
      keepalive:
        # Client: the tcpClient connection to the local Temporal frontend. Temporal frontends accept a ping every
        # 10s by default, so these values are safe.
        client:
          time: 30s                   # ping after 30s without receiving anything (minimum 10s, 0 = never)
          timeout: 20s                # close the connection if the ping isn't answered within 20s
          permitWithoutStream: true   # also ping idle connections
        # Server: the tcpServer listener the local Temporal server dials. The enforcement policy lets Temporal send
        # client keepalive pings every 30s (services.frontend.rpc.clientConnectionConfig) without being rejected.
        server:
          time: 1m                    # ping a client after 1m without receiving anything
          timeout: 20s                # close the connection if the ping isn't answered within 20s
          enforcementPolicy:
            minTime: 10s              # accept a client ping every 10s, as Temporal history, matching and frontend do
            permitWithoutStream: true # accept pings on connections with no open stream
    remote:
      connectionType: "mux-server" # One mux represents both inbound and outbound
      muxCount: 10
      muxAddressInfo:
        address: "127.0.0.1:9004"
        tls:
          certificatePath: ""
          keyPath: ""
          remoteCAPath: ""
          caServerName: ""
          skipCAVerification: true
      # On a mux definition, keepalive applies to the gRPC traffic inside the mux. yamux already pings the TCP
      # session every 30s; these settings also catch a single gRPC connection that stalls inside a healthy session.
      keepalive:
        # Client: calls this proxy makes to the peer proxy. Only turn this on once the peer proxy accepts pings
        # (its remote.keepalive.server.enforcementPolicy), or the peer closes the connection with too_many_pings.
        client:
          time: 30s
          timeout: 20s
          permitWithoutStream: true
        # Server: calls the peer proxy makes to this one.
        server:
          time: 1m
          timeout: 20s
          enforcementPolicy:
            minTime: 10s
            permitWithoutStream: true
    aclPolicy:
      allowedMethods:
        adminService:
          - AddOrUpdateRemoteCluster
          - RemoveRemoteCluster
          - DescribeCluster
          - DescribeMutableState
          - GetNamespaceReplicationMessages
          - GetWorkflowExecutionRawHistoryV2
          - ListClusters
          - StreamWorkflowReplicationMessages
          - ReapplyEvents
          - GetNamespace # for EagerGetNamespace
      allowedNamespaces:
        - namespace1
        - namespace2
    failoverVersionIncrementTranslation:
      local: 100
      remote: 1000000
    replicationEndpoint: "127.0.0.1:9002"
    namespaceTranslation:
      mappings:
        - local: "localName"
          remote: "remoteName"
    searchAttributeTranslation:
      namespaceMappings:
        - name: "namespace1"
          namespaceId: "namespace-id-1"
          mappings:
            - localFieldName: "localSearchAttribute"
              remoteFieldName: "remoteSearchAttribute"
    customSearchAttributeAliases:
      namespaceMappings:
        - name: "namespace1"
          # internal field name -> search attribute name provided by customer
          customSearchAttributeAliases:
            Keyword01: "MyKeyword"
            Keyword02: "CustomKeywordField"
            Text01: "MyText"
            Text02: "CustomStringField"
    remoteClusterHealthCheck:
      protocol: "http"
      listenAddress: "127.0.0.1:911"
    localClusterHealthCheck:
      protocol: "http"
      listenAddress: "127.0.0.1:912"
metrics:
  prometheus:
    listenAddress: "0.0.0.0:9090"
profiling:
  pprofAddress: "localhost:6060"
# Extension servers are operator-run gRPC servers implementing
# api.kms.v1.EncryptionService. They wrap and unwrap the data encryption keys
# the proxy seals payloads with, and are how you plug in a key backend the proxy
# has no built-in driver for, such as an on-prem HSM. Build one with
# temporal-proxy's pkg/ext; see its examples/kms.
#
# They are declared here, at the top level, rather than per cluster connection,
# so one server backing several connections is named and dialed once. A key
# policy reaches one through an "extension://<name>/<key>" URI; the key segment
# distinguishes several keys on one server and is never sent to it.
#
# Commented out because the addresses below point nowhere.
#
# extensionServers:
#   - name: "hsm"
#     address: "127.0.0.1:9443"
#     tls:
#       certificatePath: ""
#       keyPath: ""
#       remoteCAPath: ""
#       caServerName: "hsm.internal"
#
# A cluster connection then references it from its encryption block:
#
# clusterConnections:
#   - name: "myCoolCluster"
#     encryption:
#       enabled: true
#       # Seal the message and stack trace of failures too, by moving them into
#       # the failure's encoded attributes as the Temporal SDK does. Upgrade the
#       # peer's proxy before turning this on, or it shows a placeholder message.
#       failures: false
#       # How sealed payloads are bound to their namespace: off, permissive, or
#       # strict. Required whenever default is set. The label is the namespace's
#       # name on the peer, after namespaceTranslation, and must match what a
#       # temporal-proxy in front of the peer uses. Start on off, move to
#       # permissive once every proxy holding the keys is upgraded, and to strict
#       # once enc_unbound_opens_total, enc_namespace_mismatches_total, and
#       # enc_unresolved_namespaces_total stay at zero for longer than retention.
#       # Replication is bound the same way, by each task's namespace, which the
#       # proxy looks up by ID with DescribeNamespace on the local cluster.
#       namespaceBinding: "off"
#       cacheSize: 1000
#       default:
#         uri: "extension://hsm/payloads"
#         duration: 1h
#         renewBefore: 15m
#       # Key for admin traffic, which carries replication. Admin messages do not
#       # name their namespace, so they are sealed under this one key rather than
#       # per namespace. Omit it to seal admin traffic under default.
#       replication:
#         uri: "extension://hsm/replication"
#         duration: 1h
#         renewBefore: 15m
#       # HSM and CHASM state cannot be sealed, because the receiving server
#       # decodes it. By default an admin call or replication stream carrying
#       # it fails. Set this to send it to the peer unsealed instead.
#       allowOpaquePlaintext: false
#       # Encodings your own codec has already encrypted, passed through rather
#       # than sealed again. List only encodings that encrypt; a compression
#       # codec's would reach the peer readable.
#       alreadySealedEncodings:
#         - "binary/encrypted"
