clusterConnections:
  - name: "b-inbound-server/b-outbound-server"
    local:
      connectionType: "tcp"
      tcpClient:
        address: "localhost:8233"
      tcpServer:
        address: "0.0.0.0:6333"
    remote:
      connectionType: "mux-server"
      muxAddressInfo:
        address: "0.0.0.0:6334"
    customSearchAttributeAliases:
      namespaceMappings:
        - name: "actions-b"
          # internal field name -> search attribute name provided by customer
          customSearchAttributeAliases:
            Keyword03: "CustomKeywordField"
            Text02: "CustomStringField"
