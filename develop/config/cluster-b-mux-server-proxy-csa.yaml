clusterConnections:
  - name: "b-inbound-server/b-outbound-server"
    local:
      connectionType: "tcp"
      tcpClient:
        address: "localhost:8233"
      tcpServer:
        address: "0.0.0.0:6333"
    remote:
      connectionType: "mux-server"
      muxAddressInfo:
        address: "0.0.0.0:6334"
    customSearchAttributeAliases:
      namespaceMappings:
        - name: "actions-b"
          # internal field name -> search attribute name provided by customer
          customSearchAttributeAliases:
            Keyword03: "CustomKeywordField"
            Text02: "CustomStringField"
    searchAttributeTranslation:
      namespaceMappings:
      - name: csa
        # The namespace id, not the name. Replace this placeholder with the id of the csa namespace.
        namespaceId: "00000000-0000-0000-0000-000000000000"
        mappings:
        - remoteFieldName: CustomStringField
          localFieldName: Text01
        - remoteFieldName: CustomKeywordField
          localFieldName: Keyword01
